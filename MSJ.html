<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Ms.J</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 50%, #86a8e7 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 50%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 40px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.02);
        }

        .main-title {
            font-size: clamp(80px, 15vw, 150px);
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.8) 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titlePulse 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: clamp(30px, 5vw, 60px);
            color: #fff;
            font-weight: 600;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
            animation: textFloat 3s ease-in-out infinite;
            display: block;
            margin-bottom: 40px;
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .message-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-text {
            font-size: clamp(20px, 4vw, 40px);
            animation: colorChange 4s ease-in-out infinite;
            font-weight: 500;
        }

        @keyframes colorChange {
            0% { color: #fff; text-shadow: 0 0 20px #fff; }
            50% { color: #ffeb3b; text-shadow: 0 0 20px #ffeb3b; }
            100% { color: #fff; text-shadow: 0 0 20px #fff; }
        }

        .heart {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            animation: heartFloat 4s ease-out forwards;
            z-index: 1000;
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(0.5);
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: particleFloat 10s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .message-box {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1 class="main-title">Hello Ms.J</h1>
        <p class="subtitle">祝你每一天都快乐！</p>

        <div class="message-box">
            <p class="message-text">✨ 2026 年新的开始 ✨</p>
        </div>
    </div>

    <p class="footer">愿你心中充满阳光 💫</p>

    <script>
        // 背景音乐 - 尝试自动播放
        const bgMusic = new Audio('music/匿名好友.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.5;

        // 尝试多种方式自动播放
        function tryAutoPlay() {
            const playPromise = bgMusic.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // 自动播放成功
                    console.log('音乐自动播放成功');
                }).catch(error => {
                    console.log('自动播放被阻止，等待用户交互');
                });
            }
        }

        // 立即尝试播放
        tryAutoPlay();

        // 页面可见性变化时尝试播放
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && bgMusic.paused) {
                tryAutoPlay();
            }
        });

        // 鼠标移动时尝试播放（部分浏览器认为这是交互）
        document.addEventListener('mousemove', () => {
            if (bgMusic.paused) {
                tryAutoPlay();
            }
        }, { once: true });

        // 点击页面播放
        document.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
            }
        });

        // 创建粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = Math.random() * 10 + 5 + 'px';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        // 创建爱心效果
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 4000);
        }

        // 初始化
        createParticles();

        // 定期创建爱心
        setInterval(createHeart, 1000);

        // 点击创建爱心
        document.addEventListener('click', function(e) {
            for (let i = 0; i < 5; i++) {
                setTimeout(function() {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = e.clientX + (Math.random() - 0.5) * 100 + 'px';
                    heart.style.top = e.clientY + 'px';
                    heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    document.body.appendChild(heart);

                    setTimeout(function() {
                        heart.remove();
                    }, 4000);
                }, i * 100);
            }
        });
    </script>
</body>
</html>
